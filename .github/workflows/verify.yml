name: Verify RenewSure
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install ruff==0.16.8
      - run: ruff check .
      - run: ruff format --check .
      - run: npm exec --yes --package=eslint@10.14.0 -- eslint static tests
      - run: npm exec --yes --package=prettier@3.6.2 -- prettier --check static "tests/*.cjs" eslint.config.mjs
      - run: python verify_all.py
      - run: python scripts/check_repository.py
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-and-release
          path: |
            reports/*.json
            dist/renewsure-release.zip
          if-no-files-found: warn
